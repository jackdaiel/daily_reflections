<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reflections</title>
<!-- iPhone ホーム画面アイコン -->
<link rel="apple-touch-icon" href="diarly180.png">
<link rel="apple-touch-icon" sizes="180x180" href="diarly180.png">
<!-- Android/その他のアイコン -->
<link rel="icon" type="image/png" sizes="512x512" href="diarly512.png">
<link rel="icon" type="image/png" sizes="180x180" href="diarly180.png">
<link rel="icon" type="image/png" sizes="32x32" href="diarly180.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark: #0a0e14;
    --bg-card: #141922;
    --bg-hover: #1c212b;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent: #58a6ff;
    --accent-bright: #79c0ff;
    --accent-dim: #1f6feb;
    --success: #3fb950;
    --error: #f85149;
    --border: #30363d;
    --border-bright: #484f58;
  }

  html { height: 100%; }

  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(88, 166, 255, 0.08), transparent),
      radial-gradient(circle at 100% 100%, rgba(88, 166, 255, 0.03), transparent 40%);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: var(--text-primary);
  }

  .container {
    width: 100%;
    max-width: 520px;
    animation: fadeSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ヘッダー */
  .header {
    margin-bottom: 32px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  .header h1 {
    font-size: clamp(24px, 5vw, 28px);
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }

  .date-picker-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .date-input {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
    cursor: pointer;
  }

  .date-input:hover {
    border-color: var(--border-bright);
  }

  .date-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
  }

  /* カレンダーアイコンの色を変更 */
  .date-input::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
  }

  .date-nav-btn {
    width: 32px;
    height: 32px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .date-nav-btn:hover {
    background: var(--bg-hover);
    border-color: var(--accent);
    color: var(--accent);
  }

  .today-btn {
    padding: 6px 12px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .today-btn:hover {
    background: var(--accent);
  }

  .today-btn.is-today {
    background: var(--success);
    border-color: var(--success);
  }

  .date-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 300;
    text-align: center;
    margin-bottom: 4px;
  }

  .date-display.is-today {
    color: var(--accent-bright);
    font-weight: 400;
  }

  .header-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 300;
  }

  /* カード */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .diary-prompt {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 24px;
    font-weight: 300;
  }

  /* 入力エリア */
  .entries {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .entry-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    animation: entrySlideIn 0.4s ease both;
    opacity: 0;
    cursor: move;
    position: relative;
  }
  .entry-row:nth-child(1) { animation-delay: 0.1s; }
  .entry-row:nth-child(2) { animation-delay: 0.15s; }
  .entry-row:nth-child(3) { animation-delay: 0.2s; }
  .entry-row:nth-child(n+4) { animation-delay: 0.25s; }

  .entry-row.dragging {
    opacity: 0.5;
  }

  .entry-row.drag-over {
    border-top: 2px solid var(--accent);
  }

  .drag-handle {
    width: 20px;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    cursor: grab;
    font-size: 18px;
    user-select: none;
    flex-shrink: 0;
  }

  .drag-handle:active {
    cursor: grabbing;
  }

  @keyframes entrySlideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .entry-number {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-hover);
    border-radius: 6px;
    flex-shrink: 0;
    margin-top: 6px;
    border: 1px solid var(--border);
  }

  .entry-wrapper {
    flex: 1;
    position: relative;
  }

  .entry-input {
    width: 100%;
    min-height: 40px;
    padding: 10px 40px 10px 14px;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.6;
    color: var(--text-primary);
    resize: none;
    transition: all 0.2s ease;
  }

  .entry-input::placeholder {
    color: var(--text-muted);
  }

  .entry-input:focus {
    border-color: var(--accent);
    background: var(--bg-card);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
  }

  .entry-input:hover:not(:focus) {
    border-color: var(--border-bright);
  }

  .btn-remove {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.2s;
    font-size: 16px;
  }

  .entry-row:hover .btn-remove {
    opacity: 1;
  }

  .btn-remove:hover {
    background: var(--bg-hover);
    color: var(--error);
  }

  /* 追加ボタン */
  .btn-add-wrapper {
    margin-top: 8px;
  }

  .btn-add {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .btn-add:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(88, 166, 255, 0.05);
  }

  /* 送信ボタン */
  .submit-area {
    margin-top: 24px;
  }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: var(--bg-dark);
    border: none;
    border-radius: 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-submit::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-submit:hover {
    background: var(--accent-bright);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(88, 166, 255, 0.3);
  }

  .btn-submit:hover::before { opacity: 1; }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { 
    opacity: 0.5; 
    cursor: not-allowed; 
    transform: none; 
    box-shadow: none; 
  }

  /* ステータス */
  .status {
    margin-top: 12px;
    text-align: center;
    font-size: 12px;
    min-height: 18px;
    transition: all 0.3s ease;
  }
  .status.success { color: var(--success); }
  .status.error   { color: var(--error); }
  .status.sending { color: var(--text-secondary); animation: pulse 1.2s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* リンク */
  .view-link {
    text-align: center;
    margin-top: 20px;
  }
  
  .view-sheet-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  
  .view-sheet-btn:hover {
    background: var(--bg-hover);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(88, 166, 255, 0.2);
  }

  /* 成功オーバーレイ */
  .sent-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 20, 0.95);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .sent-overlay.show { display: flex; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .sent-icon {
    font-size: 56px;
    animation: scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes scaleIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .sent-message {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
    animation: fadeSlideIn 0.4s ease 0.2s both;
  }
  .sent-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    animation: fadeSlideIn 0.4s ease 0.3s both;
  }

  @media (max-width: 400px) {
    .card { padding: 24px 20px; }
  }

  /* カレンダー */
  .calendar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 20, 0.85);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .calendar-overlay.show { display: flex; animation: fadeIn 0.2s ease; }

  .calendar-modal {
    width: 100%;
    max-width: 340px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    animation: fadeSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .calendar-month-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-primary);
  }

  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }
  .calendar-weekdays span {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .calendar-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .calendar-day.empty {
    cursor: default;
  }

  .calendar-day:not(.empty):hover {
    background: var(--bg-hover);
    border-color: var(--border-bright);
    color: var(--text-primary);
  }

  .calendar-day.has-entry {
    color: var(--text-primary);
  }

  .calendar-day.has-entry::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }

  .calendar-day.is-today {
    border-color: var(--accent-dim);
  }

  .calendar-day.is-selected {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text-primary);
  }

  .calendar-close-btn {
    width: 100%;
    margin-top: 16px;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .calendar-close-btn:hover {
    border-color: var(--border-bright);
    color: var(--text-primary);
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-top">
      <h1>Daily Reflections</h1>
    </div>
    <div class="date-picker-wrapper">
      <button class="date-nav-btn" onclick="changeDate(-1)">‹</button>
      <input type="date" class="date-input" id="dateInput" onchange="onDateInputChange()">
      <button class="date-nav-btn" onclick="changeDate(1)">›</button>
      <button class="date-nav-btn" onclick="openCalendar()">📅</button>
      <button class="today-btn" onclick="setToday()">今日</button>
    </div>
  </div>

  <div class="card">
    <div class="entries" id="entriesContainer">
      <!-- エントリーは動的に生成 -->
    </div>

    <div class="btn-add-wrapper">
      <button class="btn-add" id="btnAdd" onclick="addEntry()">
        <span>+</span>
        <span>追加する</span>
      </button>
    </div>

    <div class="submit-area">
      <button class="btn-submit" id="submitBtn" onclick="submitDiary()">
        記録する
      </button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="view-link">
    <a href="https://docs.google.com/spreadsheets/d/17YrrxS88iokyfYPO_YXWJVdXlLgSx0OyQe4Ech6jqbo" target="_blank" id="sheetLink" class="view-sheet-btn">
      <span>📊</span>
      <span>スプレッドシートで振り返る</span>
    </a>
  </div>
</div>

<!-- 送信完了オーバーレイ -->
<div class="sent-overlay" id="sentOverlay" onclick="closeSentOverlay()">
  <div class="sent-icon">✓</div>
  <div class="sent-message">記録完了</div>
  <div class="sent-sub">tap to continue</div>
</div>

<!-- カレンダー -->
<div class="calendar-overlay" id="calendarOverlay" onclick="closeCalendar()">
  <div class="calendar-modal" onclick="event.stopPropagation()">
    <div class="calendar-header">
      <button class="date-nav-btn" onclick="calendarChangeMonth(-1)">‹</button>
      <div class="calendar-month-label" id="calendarMonthLabel"></div>
      <button class="date-nav-btn" onclick="calendarChangeMonth(1)">›</button>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <button class="calendar-close-btn" onclick="closeCalendar()">閉じる</button>
  </div>
</div>

<script>
  // ======================================================
  // ⚙️ 設定：ここを変更してください
  // ======================================================
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzUirCgPHNNQy6WMLRCJWCh7zem_AkXqsYoCl7YCPPNlkwPt0DBcB8ziNAeKPEOduOL/exec'; // Google Apps ScriptのデプロイURL
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/17YrrxS88iokyfYPO_YXWJVdXlLgSx0OyQe4Ech6jqbo';
  // ======================================================

  let entryCount = 0;
  let selectedDate = new Date();
  let currentUpdateRow = null; // 更新対象の行番号
  let isDirty = false; // 未保存の入力があるかどうか（読み込みで上書きしないためのフラグ）

  // ======================================================
  // 送信できなかった記録の退避キュー（localStorage）
  // 送信前にまずここへ書き、サーバーへの反映を読み返して確認できたら消す。
  // 確認できなければ、次にこのアプリを開いたとき／その日付を開いたときに再送する。
  // ======================================================
  const PENDING_KEY = 'dr_pending_saves';

  function getPendingSaves() {
    try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function setPendingSaves(list) {
    try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function upsertPendingSave(record) {
    const list = getPendingSaves().filter(p => p.date !== record.date);
    list.push(record);
    setPendingSaves(list);
  }
  function removePendingSave(date) {
    setPendingSaves(getPendingSaves().filter(p => p.date !== date));
  }
  function getPendingSaveFor(date) {
    return getPendingSaves().find(p => p.date === date) || null;
  }
  function currentDateStr() {
    const y = selectedDate.getFullYear();
    const m = String(selectedDate.getMonth() + 1).padStart(2, '0');
    const d = String(selectedDate.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  const _syncingDates = new Set(); // 同じ日付を同時に二重送信しないためのガード

  // record を送信し、本当にサーバーに届いたかを読み返して確認する。
  // 確認できれば退避キューから消す。確認できなければキューに残し、次の機会に再送する。
  async function syncPendingRecord(record, maxVerifyRetries = 2) {
    if (_syncingDates.has(record.date)) return;
    _syncingDates.add(record.date);

    try {
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ date: record.date, entries: record.entries, updateRow: record.updateRow })
        });
      } catch (err) {
        console.log('再送信できませんでした（オフラインの可能性）:', record.date, err.message);
        return; // 送れなかった → キューに残したまま終了（次の機会に再送）
      }

      for (let i = 0; i < maxVerifyRetries; i++) {
        await new Promise(resolve => setTimeout(resolve, 1500));
        try {
          const response = await fetch(`${GAS_URL}?date=${record.date}`, { method: 'GET' });
          const data = await response.json();
          const confirmed = data.status === 'found' && Array.isArray(data.entries) &&
            JSON.stringify(data.entries) === JSON.stringify(record.entries);

          if (confirmed) {
            removePendingSave(record.date);
            console.log('退避していた記録の同期を確認しました:', record.date);

            // 今まさにこの日付を見ている場合は、行番号などを静かに最新化する
            if (currentDateStr() === record.date) {
              currentUpdateRow = data.row;
              if (!isDirty) {
                setStatus('前回送信できなかった記録の再送に成功しました', 'success');
                setTimeout(() => setStatus('', ''), 3000);
              }
            }
            return;
          }
        } catch (err) {
          console.log('確認の読み込みに失敗しました:', record.date, err.message);
        }
      }
      console.log('まだサーバーへの反映を確認できませんでした。次の機会に再送します:', record.date);
    } finally {
      _syncingDates.delete(record.date);
    }
  }

  // 溜まっている退避データを、次にアプリを開いたタイミングでまとめて再送する
  async function flushPendingSaves() {
    const list = getPendingSaves();
    if (list.length === 0) return;
    console.log(`未送信の記録が${list.length}件あります。再送を試みます。`);
    for (const record of list) {
      await syncPendingRecord(record);
    }
  }

  // 初期化
  window.addEventListener('DOMContentLoaded', () => {
    console.log('アプリ初期化開始');
    setToday();
    for (let i = 0; i < 3; i++) {
      addEntry();
    }
    flushPendingSaves(); // 前回送れなかった記録があれば再送する
    console.log('アプリ初期化完了');
  });

  function setToday() {
    console.log('setToday 呼び出し');
    selectedDate = new Date();
    const year = selectedDate.getFullYear();
    const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
    const day = String(selectedDate.getDate()).padStart(2, '0');
    document.getElementById('dateInput').value = `${year}-${month}-${day}`;
    updateDateDisplay();
    loadExistingData();
  }

  function changeDate(delta) {
    console.log('changeDate 呼び出し:', delta);
    const currentDate = new Date(selectedDate);
    currentDate.setDate(currentDate.getDate() + delta);
    selectedDate = currentDate;
    const year = selectedDate.getFullYear();
    const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
    const day = String(selectedDate.getDate()).padStart(2, '0');
    document.getElementById('dateInput').value = `${year}-${month}-${day}`;
    updateDateDisplay();
    loadExistingData();
  }

  function onDateInputChange() {
    console.log('onDateInputChange 呼び出し');
    updateDateDisplay();
    loadExistingData();
  }

  function updateDateDisplay() {
    const dateInput = document.getElementById('dateInput');
    const dateStr = dateInput.value;
    
    if (dateStr) {
      selectedDate = new Date(dateStr + 'T00:00:00');
    }
    
    // 今日ボタンのスタイル更新
    const today = new Date();
    const isToday = 
      selectedDate.getFullYear() === today.getFullYear() &&
      selectedDate.getMonth() === today.getMonth() &&
      selectedDate.getDate() === today.getDate();
    
    const todayBtn = document.querySelector('.today-btn');
    if (todayBtn) {
      if (isToday) {
        todayBtn.classList.add('is-today');
      } else {
        todayBtn.classList.remove('is-today');
      }
    }
  }

  document.getElementById('sheetLink').href = SHEET_URL;

  // 既存データの読み込み
  async function loadExistingData() {
    // 入力中の内容がある場合は、読み込みで上書きしない（データ消失防止）
    if (isDirty) {
      console.log('未保存の入力があるため読み込みをスキップしました');
      setStatus('未保存の入力があるため、この日の読み込みを保留しました', 'success');
      return;
    }

    const year = selectedDate.getFullYear();
    const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
    const day = String(selectedDate.getDate()).padStart(2, '0');
    const dateStr = `${year}-${month}-${day}`;

    // この日付に送信できていない記録が残っている場合は、サーバーの（古い）内容より
    // そちらを優先して表示し、裏で再送する
    const pending = getPendingSaveFor(dateStr);
    if (pending) {
      currentUpdateRow = pending.updateRow;
      document.getElementById('entriesContainer').innerHTML = '';
      entryCount = 0;
      pending.entries.forEach(entry => {
        addEntry();
        const inputs = document.querySelectorAll('.entry-input');
        inputs[inputs.length - 1].value = entry;
      });
      while (entryCount < 3) {
        addEntry();
      }
      isDirty = false;
      setStatus('前回送信できなかった内容を表示しています（再送中…）', 'sending');
      syncPendingRecord(pending);
      return;
    }

    try {
      const response = await fetch(`${GAS_URL}?date=${dateStr}`, {
        method: 'GET',
      });

      const data = await response.json();

      // 通信を待っている間に入力が始まっていたら、ここでも上書きしない
      if (isDirty) {
        console.log('読み込み完了時点で未保存の入力があったため、反映をスキップしました');
        return;
      }

      if (data.status === 'found' && data.entries && data.entries.length > 0) {
        // 既存データがある場合
        currentUpdateRow = data.row;

        // 入力欄をクリア
        document.getElementById('entriesContainer').innerHTML = '';
        entryCount = 0;

        // 既存データを入力欄に設定
        data.entries.forEach(entry => {
          addEntry();
          const inputs = document.querySelectorAll('.entry-input');
          inputs[inputs.length - 1].value = entry;
        });

        // 最低3つは表示
        while (entryCount < 3) {
          addEntry();
        }
        isDirty = false; // 読み込み直後は「未保存の入力」なし

        setStatus('既存データを読み込みました（編集可能）', 'success');
        setTimeout(() => setStatus('', ''), 3000);

      } else {
        // 新規作成モード
        currentUpdateRow = null;
        document.getElementById('entriesContainer').innerHTML = '';
        entryCount = 0;
        for (let i = 0; i < 3; i++) {
          addEntry();
        }
        isDirty = false;
        setStatus('', '');
      }

    } catch (err) {
      console.log('データ読み込み中:', err.message);
      // エラーでも新規作成モードで続行（エラーメッセージは表示しない）
      currentUpdateRow = null;
      if (entryCount === 0) {
        for (let i = 0; i < 3; i++) {
          addEntry();
        }
        isDirty = false;
      }
    }
  }

  function addEntry() {
    entryCount++;
    const container = document.getElementById('entriesContainer');
    
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.dataset.id = entryCount;
    row.draggable = true;
    
    row.innerHTML = `
      <div class="drag-handle">≡</div>
      <div class="entry-number">${entryCount}</div>
      <div class="entry-wrapper">
        <textarea class="entry-input" rows="2" placeholder="入力してください…"></textarea>
        ${entryCount > 3 ? '<button class="btn-remove" onclick="removeEntry(this)">×</button>' : ''}
      </div>
    `;
    
    container.appendChild(row);
    
    const textarea = row.querySelector('.entry-input');
    
    // 自動リサイズ + 未保存フラグを立てる（読み込みに上書きされないようにする）
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      isDirty = true;
    });
    
    // Tabキー対応
    textarea.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const inputs = [...document.querySelectorAll('.entry-input')];
        const currentIndex = inputs.indexOf(this);
        const next = inputs[currentIndex + 1];
        if (next) {
          next.focus();
        } else {
          document.getElementById('btnAdd').focus();
        }
      }
    });
    
    // ドラッグ&ドロップイベント
    row.addEventListener('dragstart', handleDragStart);
    row.addEventListener('dragend', handleDragEnd);
    row.addEventListener('dragover', handleDragOver);
    row.addEventListener('drop', handleDrop);
    row.addEventListener('dragenter', handleDragEnter);
    row.addEventListener('dragleave', handleDragLeave);
  }

  function removeEntry(btn) {
    const row = btn.closest('.entry-row');
    row.style.animation = 'fadeSlideIn 0.3s ease reverse';
    setTimeout(() => row.remove(), 300);
  }

  async function submitDiary() {
    const inputs = document.querySelectorAll('.entry-input');
    const entries = [...inputs].map(el => el.value.trim()).filter(v => v !== '');

    if (entries.length === 0) {
      setStatus('少なくとも1つ入力してください', 'error');
      return;
    }

    if (GAS_URL === 'YOUR_GAS_WEB_APP_URL') {
      setStatus('⚠ GASのURLを設定してください', 'error');
      return;
    }

    document.getElementById('submitBtn').disabled = true;

    const dateStr = currentDateStr();
    const record = { date: dateStr, entries: entries, updateRow: currentUpdateRow };

    console.log('送信データ:', JSON.stringify(record));
    console.log('送信先URL:', GAS_URL);

    // 送信を試す前に、まずローカルへ退避しておく
    // （このあと送信中にタブを閉じたり通信が失敗したりしても、記録そのものは消えない）
    upsertPendingSave(record);

    // 送信を待たせず、まず完了表示にする（今の内容はこれから送信するので「未保存」ではなくなる）
    isDirty = false;
    showSentOverlay();

    // 実際の送信と、本当に届いたかの確認・必要なら再送は、すべて裏で行う
    syncPendingRecord(record);
  }

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = `status ${type}`;
  }

  function clearForm() {
    document.getElementById('entriesContainer').innerHTML = '';
    entryCount = 0;
    currentUpdateRow = null;
    for (let i = 0; i < 3; i++) {
      addEntry();
    }
    setStatus('', '');
    document.getElementById('submitBtn').disabled = false;
  }

  function showSentOverlay() {
    const message = currentUpdateRow ? '更新完了' : '記録完了';
    document.querySelector('.sent-message').textContent = message;
    document.getElementById('sentOverlay').classList.add('show');
    setTimeout(closeSentOverlay, 2000);
  }

  function closeSentOverlay() {
    document.getElementById('sentOverlay').classList.remove('show');
    document.getElementById('submitBtn').disabled = false;
  }

  // ドラッグ&ドロップ機能
  let draggedElement = null;

  function handleDragStart(e) {
    draggedElement = this;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragEnd(e) {
    this.classList.remove('dragging');
    document.querySelectorAll('.entry-row').forEach(row => {
      row.classList.remove('drag-over');
    });
    updateEntryNumbers();
  }

  function handleDragOver(e) {
    if (e.preventDefault) {
      e.preventDefault();
    }
    e.dataTransfer.dropEffect = 'move';
    return false;
  }

  function handleDragEnter(e) {
    if (this !== draggedElement) {
      this.classList.add('drag-over');
    }
  }

  function handleDragLeave(e) {
    this.classList.remove('drag-over');
  }

  function handleDrop(e) {
    if (e.stopPropagation) {
      e.stopPropagation();
    }

    if (draggedElement !== this) {
      const container = document.getElementById('entriesContainer');
      const allRows = [...container.querySelectorAll('.entry-row')];
      const draggedIndex = allRows.indexOf(draggedElement);
      const targetIndex = allRows.indexOf(this);

      if (draggedIndex < targetIndex) {
        this.parentNode.insertBefore(draggedElement, this.nextSibling);
      } else {
        this.parentNode.insertBefore(draggedElement, this);
      }
    }

    return false;
  }

  function updateEntryNumbers() {
    const rows = document.querySelectorAll('.entry-row');
    rows.forEach((row, index) => {
      const numberEl = row.querySelector('.entry-number');
      if (numberEl) {
        numberEl.textContent = index + 1;
      }
    });
  }

  // カレンダー機能
  let calendarViewDate = new Date();
  let entryDatesSet = new Set();

  function formatDateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  async function openCalendar() {
    calendarViewDate = new Date(selectedDate);
    document.getElementById('calendarOverlay').classList.add('show');
    renderCalendar(); // 先に現在の内容で描画し、体感待ちを減らす
    await fetchEntryDates();
    renderCalendar();
  }

  function closeCalendar() {
    document.getElementById('calendarOverlay').classList.remove('show');
  }

  async function fetchEntryDates() {
    try {
      const response = await fetch(`${GAS_URL}?action=dates`);
      const data = await response.json();
      entryDatesSet = new Set(data.dates || []);
    } catch (err) {
      console.log('カレンダー用データ取得失敗:', err.message);
      entryDatesSet = new Set();
    }
  }

  function calendarChangeMonth(delta) {
    calendarViewDate.setMonth(calendarViewDate.getMonth() + delta);
    renderCalendar();
  }

  function renderCalendar() {
    const year = calendarViewDate.getFullYear();
    const month = calendarViewDate.getMonth(); // 0始まり

    document.getElementById('calendarMonthLabel').textContent = `${year}年${month + 1}月`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const firstWeekday = new Date(year, month, 1).getDay(); // 0=日
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const todayStr = formatDateStr(new Date());
    const selectedStr = document.getElementById('dateInput').value;

    for (let i = 0; i < firstWeekday; i++) {
      const empty = document.createElement('div');
      empty.className = 'calendar-day empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'calendar-day';
      cell.textContent = d;
      if (entryDatesSet.has(dateStr)) cell.classList.add('has-entry');
      if (dateStr === todayStr) cell.classList.add('is-today');
      if (dateStr === selectedStr) cell.classList.add('is-selected');
      cell.onclick = () => selectCalendarDate(dateStr);
      grid.appendChild(cell);
    }
  }

  function selectCalendarDate(dateStr) {
    document.getElementById('dateInput').value = dateStr;
    updateDateDisplay();
    loadExistingData();
    closeCalendar();
  }
</script>
</body>
</html>
