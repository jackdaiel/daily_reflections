<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Reflections</title>
<!-- iPhone ホーム画面アイコン -->
<link rel="apple-touch-icon" href="diarly180.png">
<link rel="apple-touch-icon" sizes="180x180" href="diarly180.png">
<!-- Android/その他のアイコン -->
<link rel="icon" type="image/png" sizes="512x512" href="diarly512.png">
<link rel="icon" type="image/png" sizes="180x180" href="diarly180.png">
<link rel="icon" type="image/png" sizes="32x32" href="diarly180.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark: #0a0e14;
    --bg-card: #141922;
    --bg-hover: #1c212b;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent: #58a6ff;
    --accent-bright: #79c0ff;
    --accent-dim: #1f6feb;
    --success: #3fb950;
    --error: #f85149;
    --border: #30363d;
    --border-bright: #484f58;
  }

  /* 画面の拡大（ピンチ）を無効にして、操作を安定させる（スクロールは今までどおり） */
  html { height: 100%; touch-action: pan-x pan-y; }

  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(88, 166, 255, 0.08), transparent),
      radial-gradient(circle at 100% 100%, rgba(88, 166, 255, 0.03), transparent 40%);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: var(--text-primary);
  }

  .container {
    width: 100%;
    max-width: 520px;
    animation: fadeSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ヘッダー */
  .header {
    margin-bottom: 32px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  .header h1 {
    font-size: clamp(24px, 5vw, 28px);
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }

  .date-picker-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .date-input {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
    cursor: pointer;
  }

  .date-input:hover {
    border-color: var(--border-bright);
  }

  .date-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
  }

  /* カレンダーアイコンの色を変更 */
  .date-input::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
  }

  .date-nav-btn {
    width: 32px;
    height: 32px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .date-nav-btn:hover {
    background: var(--bg-hover);
    border-color: var(--accent);
    color: var(--accent);
  }

  .today-btn {
    padding: 6px 12px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .today-btn:hover {
    background: var(--accent);
  }

  .today-btn.is-today {
    background: var(--success);
    border-color: var(--success);
  }

  .date-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 300;
    text-align: center;
    margin-bottom: 4px;
  }

  .date-display.is-today {
    color: var(--accent-bright);
    font-weight: 400;
  }

  .header-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 300;
  }

  /* カード */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .diary-prompt {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 24px;
    font-weight: 300;
  }

  /* 入力エリア */
  .entries {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 読み込み中：日記・体調・写真を操作できないようにする（前の日の内容を触らせない） */
  .card.is-loading { opacity: 0.55; pointer-events: none; transition: opacity 0.15s ease; }

  .entry-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    animation: entrySlideIn 0.4s ease both;
    opacity: 0;
    cursor: move;
    position: relative;
  }
  .entry-row:nth-child(1) { animation-delay: 0.1s; }
  .entry-row:nth-child(2) { animation-delay: 0.15s; }
  .entry-row:nth-child(3) { animation-delay: 0.2s; }
  .entry-row:nth-child(n+4) { animation-delay: 0.25s; }

  .entry-row.dragging {
    opacity: 0.5;
  }

  .entry-row.drag-over {
    border-top: 2px solid var(--accent);
  }

  .drag-handle {
    width: 32px;               /* 指で押しやすい大きさ（左右の余白は負のマージンで相殺し、見た目の幅は従来どおり） */
    margin: 0 -6px;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    cursor: grab;
    font-size: 18px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;        /* ここを指で動かしても画面スクロールにならない（並び替え用） */
    flex-shrink: 0;
  }

  .drag-handle:active {
    cursor: grabbing;
  }

  /* 指で並び替え中の行（opacity/transform は入場アニメで上書きされるため、枠と背景で示す） */
  .entry-row.touch-dragging {
    outline: 1px solid var(--accent);
    outline-offset: 4px;
    border-radius: 8px;
    background: rgba(88, 166, 255, 0.08);
  }

  @keyframes entrySlideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .entry-wrapper {
    flex: 1;
    position: relative;
  }

  .entry-input {
    width: 100%;
    min-height: 40px;
    padding: 10px 40px 10px 14px;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.6;
    color: var(--text-primary);
    resize: none;
    transition: all 0.2s ease;
  }

  .entry-input::placeholder {
    color: var(--text-muted);
  }

  .entry-input:focus {
    border-color: var(--accent);
    background: var(--bg-card);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
  }

  .entry-input:hover:not(:focus) {
    border-color: var(--border-bright);
  }

  .btn-remove {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.2s;
    font-size: 16px;
  }

  .entry-row:hover .btn-remove {
    opacity: 1;
  }

  .btn-remove:hover {
    background: var(--bg-hover);
    color: var(--error);
  }

  /* 追加ボタン */
  .btn-add-wrapper {
    margin-top: 8px;
  }

  /* 「＋ 追加する」（日記）と「📷 写真」を横に並べる */
  .add-row {
    display: flex;
    gap: 8px;
  }

  /* 2つのボタンは同じ幅（半分ずつ） */
  .add-row .btn-add { width: auto; flex: 1 1 0; min-width: 0; white-space: nowrap; }

  .btn-add {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .btn-add:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(88, 166, 255, 0.05);
  }

  /* 体調欄（日記の入力欄とは別物。.entry-input は日記の件数を数えるのに使うので共用しない） */
  .health-section {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .health-label {
    display: block;
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
  }

  .health-input {
    width: 100%;
    min-height: 40px;
    padding: 10px 14px;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.6;
    color: var(--text-primary);
    resize: none;
    transition: all 0.2s ease;
  }

  .health-input::placeholder {
    color: var(--text-muted);
  }

  .health-input:focus {
    border-color: var(--accent);
    background: var(--bg-card);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
  }

  .health-input:hover:not(:focus) {
    border-color: var(--border-bright);
  }

  /* 写真欄（1日2枚まで。端末で縮小してから送る） */
  .photo-section {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .photo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .photo-grid:empty { display: none; }

  /* 1枚のときは、幅いっぱいに大きく（全体が見えるよう切り取らない） */
  .photo-grid.is-single { grid-template-columns: 1fr; }
  .photo-grid.is-single .photo-item { aspect-ratio: auto; min-height: 160px; }
  .photo-grid.is-single .photo-item img { height: auto; max-height: 560px; object-fit: contain; }


  .photo-item {
    position: relative;
    aspect-ratio: 4 / 3;
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
  }

  .photo-state {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
    background: rgba(10, 14, 20, 0.55);
  }

  .photo-state.is-error {
    color: var(--error);
    background: rgba(10, 14, 20, 0.8);
    cursor: pointer;
  }

  .photo-item.is-empty .photo-state { background: transparent; }

  .photo-remove {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 14, 20, 0.75);
    border: 1px solid var(--border-bright);
    border-radius: 50%;
    color: var(--text-primary);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }

  .photo-remove:hover { color: var(--error); border-color: var(--error); }

  .btn-photo-add[disabled] { opacity: 0.4; cursor: default; }

  .photo-note:empty { display: none; }

  .photo-note {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* 写真の拡大表示 */
  .photo-viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 120;
    background: rgba(0, 0, 0, 0.92);
    align-items: center;
    justify-content: center;
    padding: 16px 16px calc(84px + env(safe-area-inset-bottom));  /* 下に削除ボタンの分の余白 */
    cursor: zoom-out;
  }

  .photo-viewer.show { display: flex; }

  .photo-viewer img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .photo-viewer-delete {
    position: absolute;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    padding: 11px 24px;
    background: rgba(10, 14, 20, 0.85);
    border: 1px solid var(--border-bright);
    border-radius: 999px;
    color: var(--error);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* 送信ボタン */
  .submit-area {
    margin-top: 24px;
  }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: var(--bg-dark);
    border: none;
    border-radius: 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-submit::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-submit:hover {
    background: var(--accent-bright);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(88, 166, 255, 0.3);
  }

  .btn-submit:hover::before { opacity: 1; }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { 
    opacity: 0.5; 
    cursor: not-allowed; 
    transform: none; 
    box-shadow: none; 
  }

  /* ステータス */
  .status {
    margin-top: 12px;
    text-align: center;
    font-size: 12px;
    min-height: 18px;
    transition: all 0.3s ease;
  }
  .status.success { color: var(--success); }
  .status.error   { color: var(--error); }
  .status.sending { color: var(--text-secondary); animation: pulse 1.2s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* リンク */
  .view-link {
    text-align: center;
    margin-top: 20px;
  }
  
  .view-sheet-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  
  .view-sheet-btn:hover {
    background: var(--bg-hover);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(88, 166, 255, 0.2);
  }

  /* 成功オーバーレイ */
  .sent-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 20, 0.95);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .sent-overlay.show { display: flex; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .sent-icon {
    font-size: 56px;
    animation: scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes scaleIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .sent-message {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
    animation: fadeSlideIn 0.4s ease 0.2s both;
  }
  .sent-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    animation: fadeSlideIn 0.4s ease 0.3s both;
  }

  @media (max-width: 400px) {
    .card { padding: 24px 20px; }
  }

  /* カレンダー */
  .calendar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 20, 0.85);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .calendar-overlay.show { display: flex; animation: fadeIn 0.2s ease; }

  .calendar-modal {
    width: 100%;
    max-width: 340px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    animation: fadeSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .calendar-month-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-primary);
  }

  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }
  .calendar-weekdays span {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .calendar-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .calendar-day.empty {
    cursor: default;
  }

  .calendar-day:not(.empty):hover {
    background: var(--bg-hover);
    border-color: var(--border-bright);
    color: var(--text-primary);
  }

  .calendar-day.has-entry {
    color: var(--text-primary);
  }

  .calendar-day.has-entry::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }

  .calendar-day.is-today {
    border-color: var(--accent-dim);
  }

  .calendar-day.is-selected {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text-primary);
  }

  .calendar-close-btn {
    width: 100%;
    margin-top: 16px;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .calendar-close-btn:hover {
    border-color: var(--border-bright);
    color: var(--text-primary);
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-top">
      <h1>Daily Reflections</h1>
    </div>
    <div class="date-picker-wrapper">
      <button class="date-nav-btn" onclick="changeDate(-1)">‹</button>
      <input type="date" class="date-input" id="dateInput" onchange="onDateInputChange()">
      <button class="date-nav-btn" onclick="changeDate(1)">›</button>
      <button class="date-nav-btn" onclick="openCalendar()">📅</button>
      <button class="today-btn" onclick="setToday()">今日</button>
    </div>
  </div>

  <div class="card">
    <div class="photo-section">
      <div class="photo-grid" id="photoGrid"></div>
    </div>

    <div class="entries" id="entriesContainer">
      <!-- エントリーは動的に生成 -->
    </div>

    <div class="btn-add-wrapper">
      <div class="add-row">
        <button class="btn-add" id="btnAdd" onclick="addEntry()">
          <span>+</span>
          <span>日記を追加</span>
        </button>
        <button type="button" class="btn-add btn-photo-add" id="btnPhotoAdd" onclick="document.getElementById('photoFile').click()">
          <span>📷</span>
          <span>写真を追加</span>
        </button>
      </div>
      <input type="file" id="photoFile" accept="image/*" multiple hidden>
      <div class="photo-note" id="photoNote"></div>
    </div>

    <div class="health-section">
      <label class="health-label" for="healthInput">体調</label>
      <textarea class="health-input" id="healthInput" rows="2" placeholder="今日の体調（任意）"></textarea>
    </div>

    <div class="submit-area">
      <button class="btn-submit" id="submitBtn" onclick="submitDiary()">
        記録する
      </button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="view-link">
    <a href="https://docs.google.com/spreadsheets/d/17YrrxS88iokyfYPO_YXWJVdXlLgSx0OyQe4Ech6jqbo" target="_blank" id="sheetLink" class="view-sheet-btn">
      <span>📊</span>
      <span>スプレッドシートで振り返る</span>
    </a>
  </div>
</div>

<!-- 写真の拡大表示（タップで閉じる） -->
<div class="photo-viewer" id="photoViewer" onclick="closePhotoViewer()">
  <img id="photoViewerImg" alt="">
  <button type="button" class="photo-viewer-delete" id="photoViewerDelete" onclick="deleteViewedPhoto(event)">この写真を削除</button>
</div>

  <div class="sent-icon">✓</div>
  <div class="sent-message">記録完了</div>
  <div class="sent-sub">tap to continue</div>
</div>

<!-- カレンダー -->
<div class="calendar-overlay" id="calendarOverlay" onclick="closeCalendar()">
  <div class="calendar-modal" onclick="event.stopPropagation()">
    <div class="calendar-header">
      <button class="date-nav-btn" onclick="calendarChangeMonth(-1)">‹</button>
      <div class="calendar-month-label" id="calendarMonthLabel"></div>
      <button class="date-nav-btn" onclick="calendarChangeMonth(1)">›</button>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <button class="calendar-close-btn" onclick="closeCalendar()">閉じる</button>
  </div>
</div>

<script>
  // ======================================================
  // ⚙️ 設定：ここを変更してください
  // ======================================================
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzUirCgPHNNQy6WMLRCJWCh7zem_AkXqsYoCl7YCPPNlkwPt0DBcB8ziNAeKPEOduOL/exec'; // Google Apps ScriptのデプロイURL
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/17YrrxS88iokyfYPO_YXWJVdXlLgSx0OyQe4Ech6jqbo';
  // ======================================================

  // ── 合言葉（アクセスキー）──
  // このファイルは公開リポジトリにあるため、キーはコードに書かない。
  // 初回に入力した合言葉をこの端末のlocalStorageに保存する（保存できない環境ではこの画面を開いている間だけ保持）。
  const KEY_STORE = 'dr_access_key';
  let _accessKey = '';
  function getAccessKey() {
    if (_accessKey) return _accessKey;
    try { _accessKey = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
    return _accessKey;
  }
  function askAccessKey(msg) {
    const v = (prompt(msg || '合言葉を入力してください') || '').trim();
    if (v) {
      _accessKey = v;
      try { localStorage.setItem(KEY_STORE, v); } catch (e) {}
    }
    return _accessKey;
  }
  function forgetAccessKey() {
    _accessKey = '';
    try { localStorage.removeItem(KEY_STORE); } catch (e) {}
  }
  // GET用のURL（合言葉を付ける）
  function gasGetUrl(params) {
    return GAS_URL + '?' + new URLSearchParams({ ...params, key: getAccessKey() }).toString();
  }

  let entryCount = 0;
  let selectedDate = new Date();
  let currentUpdateRow = null; // 更新対象の行番号
  let isDirty = false; // 未保存の入力があるかどうか（読み込みで上書きしないためのフラグ）

  // ── 「画面の内容は、どの日付のものか」を管理する ──
  // 画面の内容が、表示中の日付と違う日付のものになったまま保存されると、別の日に内容がコピーされてしまう。
  // それを防ぐため、①日付の移動は未保存の変更を確認してから、②読み込み中は入力できない状態にして前の日の内容も消す、
  // ③遅れて届いた古い読み込み結果は捨てる、④保存の直前に「内容の日付＝表示中の日付」を照合する。
  let formDate = null;   // 今の画面の内容が属する日付（読み込み済み・入力開始済みの日付）。未確定のときは null
  let loadSeq = 0;       // 読み込みの通し番号（古い読み込みの結果を捨てるため）
  let navigating = false; // 日付の移動の確認中

  function markDirty() {
    isDirty = true;
    if (!formDate) formDate = currentDateStr();
  }

  // 読み込み中は、日記・体調・写真を操作できないようにし、保存も止める
  function setLoading(on) {
    document.querySelector('.card').classList.toggle('is-loading', on);
    document.getElementById('submitBtn').disabled = on;
  }

  // ======================================================
  // 送信できなかった記録の退避キュー（localStorage）
  // 送信前にまずここへ書き、サーバーへの反映を読み返して確認できたら消す。
  // 確認できなければ、次にこのアプリを開いたとき／その日付を開いたときに再送する。
  // ======================================================
  const PENDING_KEY = 'dr_pending_saves';

  function getPendingSaves() {
    try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function setPendingSaves(list) {
    try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function upsertPendingSave(record) {
    const list = getPendingSaves().filter(p => p.date !== record.date);
    list.push(record);
    setPendingSaves(list);
  }
  function removePendingSave(date) {
    setPendingSaves(getPendingSaves().filter(p => p.date !== date));
  }
  function getPendingSaveFor(date) {
    return getPendingSaves().find(p => p.date === date) || null;
  }
  function currentDateStr() {
    const y = selectedDate.getFullYear();
    const m = String(selectedDate.getMonth() + 1).padStart(2, '0');
    const d = String(selectedDate.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  // ── 体調欄 ──
  function getHealth() {
    return document.getElementById('healthInput').value.trim();
  }
  // 内容に合わせて高さを調整する（枠線の分も含める）
  function fitHealthHeight() {
    const el = document.getElementById('healthInput');
    el.style.height = 'auto';
    if (el.value) el.style.height = (el.scrollHeight + el.offsetHeight - el.clientHeight) + 'px';
  }
  function setHealth(value) {
    document.getElementById('healthInput').value = value || '';
    fitHealthHeight();
  }

  // ── 写真欄 ──
  // 1日最大2枚。選んだ写真は端末で縮小（長辺1280px・JPEG）してから、すぐ裏でGASへ送る。
  // 日記の保存で送るのは写真の識別子（トークン）だけなので、保存は今までどおり軽い。
  // 既存の写真は、その日を開いたときに1枚ずつ取得して表示する。
  const PHOTO_MAX = 2;
  const PHOTO_MAX_EDGE = 1280;
  const PHOTO_MAX_BASE64 = 2000000; // サーバー側の上限（2,500,000文字）より余裕を持たせる
  let photos = [];          // [{token, dataUrl, status: 'loading'|'uploading'|'done'|'error', local, promise}]
  let photosKnown = false;  // この日の写真の状態をサーバーから確認できているか（未確認の間は保存時に写真を送らない＝今の写真を変えない）
  const photoCache = {};    // token → dataUrl（同じ写真を取り直さない）

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  function newPhotoToken() {
    return 'ph' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // 画像ファイルを縮小して JPEG の dataURL にする
  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale));
          const h = Math.max(1, Math.round(img.naturalHeight * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; // 透過部分は白で埋める（JPEGは透過を持てない）
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          let q = 0.82;
          let dataUrl = canvas.toDataURL('image/jpeg', q);
          while (dataUrl.length > PHOTO_MAX_BASE64 && q > 0.4) {
            q -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', q);
          }
          resolve(dataUrl);
        } catch (err) {
          reject(err);
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
      img.src = url;
    });
  }

  // 新しく選んだ写真をGASへ送る（日記の行には触れない）。届いたかを読み返して確認する。
  async function uploadPhotoItem(p) {
    p.status = 'uploading';
    renderPhotos();
    if (!getAccessKey() && !askAccessKey()) { p.status = 'error'; renderPhotos(); return false; }
    try {
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'photo', date: currentDateStr(), token: p.token, mime: 'image/jpeg', data: p.dataUrl.split(',')[1], key: getAccessKey() })
      });
    } catch (err) {
      console.log('写真を送信できませんでした:', err.message);
      p.status = 'error'; renderPhotos();
      return false;
    }
    for (let i = 0; i < 6; i++) {
      await sleep(i === 0 ? 1500 : 2000);
      try {
        const response = await fetch(gasGetUrl({ action: 'photo_check', token: p.token }), { method: 'GET' });
        const data = await response.json();
        if (data.status === 'unauthorized') { forgetAccessKey(); break; }
        if (data.status === 'found') { p.status = 'done'; renderPhotos(); return true; }
      } catch (err) {
        console.log('写真の確認に失敗しました:', err.message);
      }
    }
    p.status = 'error'; renderPhotos();
    return false;
  }

  // 送信を二重に走らせない（保存ボタンから待つときも同じ送信を待つ）
  function ensurePhotoUploaded(p) {
    if (p.status === 'done') return Promise.resolve(true);
    if (!p.promise) {
      p.promise = uploadPhotoItem(p).finally(() => { p.promise = null; });
    }
    return p.promise;
  }

  // サーバーにある写真を1枚取得して表示する
  async function fetchRemotePhoto(p) {
    if (photoCache[p.token]) {
      p.dataUrl = photoCache[p.token]; p.status = 'done'; renderPhotos();
      return;
    }
    p.status = 'loading';
    renderPhotos();
    try {
      const response = await fetch(gasGetUrl({ action: 'photo', token: p.token }), { method: 'GET' });
      const data = await response.json();
      if (data.status === 'found' && data.data) {
        photoCache[p.token] = 'data:' + (data.mime || 'image/jpeg') + ';base64,' + data.data;
        p.dataUrl = photoCache[p.token];
        p.status = 'done';
      } else {
        p.status = 'error';
      }
    } catch (err) {
      console.log('写真の読み込みに失敗しました:', err.message);
      p.status = 'error';
    }
    renderPhotos();
  }

  // この日の写真（トークンの配列）を表示する。tokens が undefined のときは「状態不明」として写真欄を空にし、保存時にも写真を送らない。
  function setPhotos(tokens) {
    if (!Array.isArray(tokens)) {
      photos = [];
      photosKnown = false;
      renderPhotos();
      return;
    }
    photosKnown = true;
    photos = tokens.map(t => ({ token: t, dataUrl: photoCache[t] || null, status: photoCache[t] ? 'done' : 'loading', local: false, promise: null }));
    renderPhotos();
    photos.filter(p => !p.dataUrl).forEach(p => fetchRemotePhoto(p));
  }

  function getPhotoTokens() {
    return photos.map(p => p.token);
  }

  function renderPhotos() {
    const grid = document.getElementById('photoGrid');
    grid.innerHTML = '';
    grid.classList.toggle('is-single', photos.length === 1);
    document.querySelector('.photo-section').style.display = photos.length ? '' : 'none';
    photos.forEach(p => {
      const item = document.createElement('div');
      item.className = 'photo-item' + (p.dataUrl ? '' : ' is-empty');
      if (p.dataUrl) {
        const img = document.createElement('img');
        img.src = p.dataUrl;
        img.alt = '日記の写真';
        img.addEventListener('click', () => openPhotoViewer(p));
        item.appendChild(img);
      }
      if (p.status !== 'done') {
        const st = document.createElement('div');
        st.className = 'photo-state' + (p.status === 'error' ? ' is-error' : '');
        st.textContent = p.status === 'uploading' ? '送信中…'
          : p.status === 'loading' ? '読み込み中…'
          : (p.local ? '送信できませんでした\nタップで再送' : '読み込めませんでした\nタップで再読み込み');
        st.style.whiteSpace = 'pre-line';
        if (p.status === 'error') {
          st.addEventListener('click', () => { p.local ? ensurePhotoUploaded(p) : fetchRemotePhoto(p); });
        }
        item.appendChild(st);
      }
      // 写真が表示できているときは、×は付けない（写真をタップして拡大した画面から削除する）。
      // 写真が表示できていないとき（読み込み失敗など）は、拡大できないので、従来どおり×で外せるようにしておく。
      if (!p.dataUrl) {
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'photo-remove';
        rm.setAttribute('aria-label', '写真を外す');
        rm.textContent = '×';
        rm.addEventListener('click', () => removePhoto(p));
        item.appendChild(rm);
      }
      grid.appendChild(item);
    });

    const addBtn = document.getElementById('btnPhotoAdd');
    const note = document.getElementById('photoNote');
    const full = photos.length >= PHOTO_MAX;
    addBtn.disabled = !photosKnown || full;
    note.textContent = !photosKnown ? 'この日の写真を確認できていません（通信が戻ると使えます）'
      : full ? '写真は1日2枚までです' : '';
  }

  function removePhoto(p) {
    photos = photos.filter(x => x !== p);
    markDirty();
    renderPhotos();
  }

  async function onPhotoFilesChosen(files) {
    const room = PHOTO_MAX - photos.length;
    const chosen = [...files].slice(0, Math.max(room, 0));
    if (files.length > chosen.length) setStatus('写真は1日2枚までです', 'error');
    const dateAtStart = currentDateStr();
    for (const file of chosen) {
      try {
        const dataUrl = await resizeImage(file);
        if (currentDateStr() !== dateAtStart || formDate !== dateAtStart) break; // 縮小している間に日付が動いた：別の日に付けない
        if (photos.length >= PHOTO_MAX) break;
        const p = { token: newPhotoToken(), dataUrl: dataUrl, status: 'uploading', local: true, promise: null };
        photos.push(p);
        markDirty();
        renderPhotos();
        ensurePhotoUploaded(p);
      } catch (err) {
        console.log('写真を処理できませんでした:', err.message);
        setStatus('この写真は読み込めませんでした', 'error');
      }
    }
  }

  let viewedPhoto = null; // 拡大表示中の写真
  function openPhotoViewer(p) {
    viewedPhoto = p;
    document.getElementById('photoViewerImg').src = p.dataUrl;
    document.getElementById('photoViewer').classList.add('show');
  }
  function closePhotoViewer() {
    viewedPhoto = null;
    document.getElementById('photoViewer').classList.remove('show');
    document.getElementById('photoViewerImg').removeAttribute('src');
  }
  // 拡大表示の「この写真を削除」：確認してから外す（外した内容は「記録する」を押すと確定する）
  function deleteViewedPhoto(e) {
    e.stopPropagation(); // 背景のタップ（閉じる）として扱わない
    const p = viewedPhoto;
    if (!p) return;
    if (!confirm('この写真を削除しますか？\n（「記録する」を押すと確定します）')) return;
    closePhotoViewer();
    removePhoto(p);
  }

  const _syncingDates = new Set(); // 同じ日付を同時に二重送信しないためのガード

  // record を送信し、本当にサーバーに届いたかを読み返して確認する。
  // 確認できれば退避キューから消す。確認できなければキューに残し、次の機会に再送する。
  async function syncPendingRecord(record, maxVerifyRetries = 2) {
    if (_syncingDates.has(record.date)) return;
    _syncingDates.add(record.date);

    try {
      // 合言葉が未入力なら尋ねる（入力しなければ送らず、記録は端末に退避したまま残る）
      if (!getAccessKey() && !askAccessKey()) {
        setStatus('合言葉が未入力のため送信できていません（記録は端末に残っています）', 'error');
        return;
      }
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          // health が undefined（体調対応前に退避された記録）のときは、JSONに含まれず、サーバー側の体調は変わらない
          // photos も同様：undefined（写真の状態を確認できていなかった記録）のときは、サーバー側の写真は変わらない
          body: JSON.stringify({ date: record.date, entries: record.entries, health: record.health, photos: record.photos, updateRow: record.updateRow, key: getAccessKey() })
        });
      } catch (err) {
        console.log('再送信できませんでした（オフラインの可能性）:', record.date, err.message);
        return; // 送れなかった → キューに残したまま終了（次の機会に再送）
      }

      for (let i = 0; i < maxVerifyRetries; i++) {
        await new Promise(resolve => setTimeout(resolve, 1500));
        try {
          const response = await fetch(gasGetUrl({ date: record.date }), { method: 'GET' });
          const data = await response.json();
          if (data.status === 'unauthorized') {
            // 合言葉が違う：保存済みのものを捨てる。記録は端末に残り、次に正しい合言葉を入れたときに再送される
            forgetAccessKey();
            setStatus('合言葉が違うため送信できていません（記録は端末に残っています）。開き直して合言葉を入力してください', 'error');
            return;
          }
          // 日記の内容と、体調・写真（送った場合のみ）がサーバーに反映されたら「届いた」とみなす
          const confirmed = data.status === 'found' && Array.isArray(data.entries) &&
            JSON.stringify(data.entries) === JSON.stringify(record.entries) &&
            (record.health === undefined || (data.health || '') === record.health) &&
            (record.photos === undefined || JSON.stringify(data.photos || []) === JSON.stringify(record.photos));

          if (confirmed) {
            removePendingSave(record.date);
            console.log('退避していた記録の同期を確認しました:', record.date);

            // 今まさにこの日付を見ている場合は、行番号などを静かに最新化する
            if (currentDateStr() === record.date) {
              currentUpdateRow = data.row;
              if (!isDirty) {
                setStatus('前回送信できなかった記録の再送に成功しました', 'success');
                setTimeout(() => setStatus('', ''), 3000);
              }
            }
            return;
          }
        } catch (err) {
          console.log('確認の読み込みに失敗しました:', record.date, err.message);
        }
      }
      console.log('まだサーバーへの反映を確認できませんでした。次の機会に再送します:', record.date);
    } finally {
      _syncingDates.delete(record.date);
    }
  }

  // 溜まっている退避データを、次にアプリを開いたタイミングでまとめて再送する
  async function flushPendingSaves() {
    const list = getPendingSaves();
    if (list.length === 0) return;
    console.log(`未送信の記録が${list.length}件あります。再送を試みます。`);
    for (const record of list) {
      await syncPendingRecord(record);
    }
  }

  // iPhoneのSafari／ホーム画面アプリは meta の指定を無視してピンチ拡大できてしまうため、ピンチ操作そのものを止める
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

  // 初期化
  window.addEventListener('DOMContentLoaded', () => {
    console.log('アプリ初期化開始');
    // 体調欄：入力したら「未保存」扱いにして、読み込みで上書きされないようにする（日記欄と同じ扱い）
    document.getElementById('healthInput').addEventListener('input', function() {
      fitHealthHeight();
      markDirty();
    });
    document.getElementById('photoFile').addEventListener('change', function() {
      const files = [...this.files];
      this.value = ''; // 同じ写真をもう一度選べるようにする
      if (files.length) onPhotoFilesChosen(files);
    });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePhotoViewer(); });
    renderPhotos();
    setToday();
    for (let i = 0; i < 3; i++) {
      addEntry();
    }
    flushPendingSaves(); // 前回送れなかった記録があれば再送する
    console.log('アプリ初期化完了');
  });

  function setToday() {
    goToDate(formatDateStr(new Date()));
  }

  function changeDate(delta) {
    const d = new Date(selectedDate);
    d.setDate(d.getDate() + delta);
    goToDate(formatDateStr(d));
  }

  function onDateInputChange() {
    goToDate(document.getElementById('dateInput').value);
  }

  function dateLabel(dateStr) {
    const [, m, d] = dateStr.split('-');
    return `${Number(m)}月${Number(d)}日`;
  }

  // 日付入力欄の表示を、今の日付に戻す
  function restoreDateInput() {
    document.getElementById('dateInput').value = currentDateStr();
    updateDateDisplay();
  }

  // すべての日付の移動（‹ › 今日 日付入力 カレンダー）はここを通る。
  // 未保存の変更があるときは、その内容を別の日に持ち越さないよう、保存するか破棄するかを必ず確認する。
  async function goToDate(newDateStr) {
    if (navigating) { restoreDateInput(); return; } // 確認中の二重操作は無視
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(newDateStr || ''))) { restoreDateInput(); return; }

    const cur = currentDateStr();
    if (newDateStr === cur) {
      restoreDateInput();
      if (!isDirty) loadExistingData(); // 同じ日付：読み込み直すだけ（未保存の変更があるときは何もしない）
      return;
    }

    if (isDirty) {
      navigating = true;
      try {
        const label = dateLabel(cur);
        if (confirm(`${label}の内容に、保存していない変更があります。\n\n保存してから移動しますか？\n\nOK：保存して移動\nキャンセル：次へ`)) {
          const saved = await submitDiary(); // 保存は、まだ元の日付（cur）のまま行われる
          if (!saved) { restoreDateInput(); return; }
        } else if (!confirm(`保存せずに移動しますか？\n\n${label}の保存していない変更は、破棄されます。\n\nOK：破棄して移動\nキャンセル：移動しない`)) {
          restoreDateInput();
          return;
        }
        isDirty = false;
      } finally {
        navigating = false;
      }
    }

    selectedDate = new Date(newDateStr + 'T00:00:00');
    document.getElementById('dateInput').value = newDateStr;
    updateDateDisplay();
    resetFormForLoad(); // 前の日の内容を画面に残さない
    loadExistingData();
  }

  // 日付を移動した直後：前の日の内容を消して、読み込み中の状態にする
  function resetFormForLoad() {
    document.getElementById('entriesContainer').innerHTML = '';
    entryCount = 0;
    for (let i = 0; i < 3; i++) addEntry();
    setHealth('');
    setPhotos(undefined);
    currentUpdateRow = null;
    formDate = null;
    isDirty = false;
  }

  function updateDateDisplay() {
    const dateInput = document.getElementById('dateInput');
    const dateStr = dateInput.value;
    
    if (dateStr) {
      selectedDate = new Date(dateStr + 'T00:00:00');
    }
    
    // 今日ボタンのスタイル更新
    const today = new Date();
    const isToday = 
      selectedDate.getFullYear() === today.getFullYear() &&
      selectedDate.getMonth() === today.getMonth() &&
      selectedDate.getDate() === today.getDate();
    
    const todayBtn = document.querySelector('.today-btn');
    if (todayBtn) {
      if (isToday) {
        todayBtn.classList.add('is-today');
      } else {
        todayBtn.classList.remove('is-today');
      }
    }
  }

  document.getElementById('sheetLink').href = SHEET_URL;

  // 既存データの読み込み
  async function loadExistingData() {
    // 未保存の入力があるときは、日付を移動する前に goToDate が確認する。ここに来た時点では通常は無い（念のための保険）。
    if (isDirty) {
      console.log('未保存の入力があるため読み込みをスキップしました');
      setStatus('未保存の入力があるため、読み込みを保留しました', 'success');
      return;
    }

    const dateStr = currentDateStr();
    const seq = ++loadSeq;
    // この読み込みの結果を、まだ画面に反映してよいか（その間に別の日付へ移動していたら、反映しない）
    const stillCurrent = () => seq === loadSeq && dateStr === currentDateStr();

    setLoading(true);
    setStatus('読み込み中…', 'sending');
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000); // 応答が無いまま画面が固まらないように

    try {
      // この日付に送信できていない記録が残っている場合は、サーバーの（古い）内容より
      // そちらを優先して表示し、裏で再送する
      const pending = getPendingSaveFor(dateStr);
      if (pending) {
        currentUpdateRow = pending.updateRow;
        document.getElementById('entriesContainer').innerHTML = '';
        entryCount = 0;
        pending.entries.forEach(entry => {
          addEntry();
          const inputs = document.querySelectorAll('.entry-input');
          inputs[inputs.length - 1].value = entry;
        });
        while (entryCount < 3) {
          addEntry();
        }
        fitAllEntryHeights();
        setHealth(pending.health);
        setPhotos(pending.photos);
        isDirty = false;
        formDate = dateStr;
        setStatus('前回送信できなかった内容を表示しています（再送中…）', 'sending');
        syncPendingRecord(pending);
        return;
      }

      // 合言葉が未入力なら尋ねる。入力しなければ、既存の記録は読み込まない（入力欄は空のまま）
      if (!getAccessKey() && !askAccessKey()) {
        formDate = dateStr;
        setStatus('合言葉が未入力のため、記録を読み込めません', 'error');
        return;
      }

      const response = await fetch(gasGetUrl({ date: dateStr }), {
        method: 'GET',
        signal: ctrl.signal,
      });

      const data = await response.json();

      // 待っている間に別の日付へ移動していたら、この結果は捨てる（今の日付の画面を上書きしない）
      if (!stillCurrent()) {
        console.log('古い読み込み結果のため捨てました:', dateStr);
        return;
      }

      // 合言葉が違う場合は、入力欄をそのままにして、入れ直してもらう
      if (data.status === 'unauthorized') {
        forgetAccessKey();
        if (askAccessKey('合言葉が違います。もう一度入力してください')) {
          clearTimeout(timer);
          return loadExistingData();
        }
        formDate = dateStr;
        setStatus('合言葉が違うため、記録を読み込めません', 'error');
        return;
      }

      // 通信を待っている間に入力が始まっていたら、ここでも上書きしない
      if (isDirty) {
        console.log('読み込み完了時点で未保存の入力があったため、反映をスキップしました');
        return;
      }

      // 日記・体調・写真のどれかが入っていれば「既存データあり」（体調だけ・写真だけの日もある）
      if (data.status === 'found' && ((data.entries && data.entries.length > 0) || data.health || (data.photos && data.photos.length > 0))) {
        // 既存データがある場合
        currentUpdateRow = data.row;

        // 入力欄をクリア
        document.getElementById('entriesContainer').innerHTML = '';
        entryCount = 0;

        // 既存データを入力欄に設定
        data.entries.forEach(entry => {
          addEntry();
          const inputs = document.querySelectorAll('.entry-input');
          inputs[inputs.length - 1].value = entry;
        });

        // 最低3つは表示
        while (entryCount < 3) {
          addEntry();
        }
        fitAllEntryHeights();
        setHealth(data.health);
        setPhotos(data.photos); // 古いサーバー（写真未対応）のときは undefined → 写真欄は触れない扱い
        isDirty = false; // 読み込み直後は「未保存の入力」なし
        formDate = dateStr;

        setStatus('既存データを読み込みました（編集可能）', 'success');
        setTimeout(() => setStatus('', ''), 3000);

      } else {
        // 新規作成モード
        currentUpdateRow = null;
        document.getElementById('entriesContainer').innerHTML = '';
        entryCount = 0;
        for (let i = 0; i < 3; i++) {
          addEntry();
        }
        setHealth('');
        setPhotos(data.status === 'not_found' ? [] : data.photos);
        isDirty = false;
        formDate = dateStr;
        setStatus('', '');
      }

    } catch (err) {
      console.log('データ読み込み中:', err.message);
      if (!stillCurrent()) return;
      // 読み込めなかったときも、空の入力欄で続行する（オフラインでも書けて、あとで再送される）。前の日の内容は残さない。
      currentUpdateRow = null;
      setPhotos(undefined); // 写真の状態が分からないので、保存時に写真は送らない
      if (!isDirty) {
        document.getElementById('entriesContainer').innerHTML = '';
        entryCount = 0;
        for (let i = 0; i < 3; i++) {
          addEntry();
        }
        setHealth('');
      }
      formDate = dateStr;
      setStatus('この日の記録を読み込めませんでした（通信を確認してください）', 'error');
    } finally {
      clearTimeout(timer);
      if (seq === loadSeq) setLoading(false);
    }
  }

  // 日記の入力欄を、文章の長さに合わせた高さにする（全文が見えるように）。枠線の分も含める。
  // 画面に出ていない（高さが測れない）ときは何もしない。
  function fitEntryHeight(el) {
    el.style.height = 'auto';
    if (!el.scrollHeight) return;
    el.style.height = (el.scrollHeight + el.offsetHeight - el.clientHeight) + 'px';
  }
  function fitAllEntryHeights() {
    document.querySelectorAll('.entry-input').forEach(fitEntryHeight);
  }
  // 画面の幅が変わったとき（横向きにしたとき等）と、文字の読み込みが終わったときは、折り返しが変わるので合わせ直す
  let _fitWidth = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth !== _fitWidth) { _fitWidth = window.innerWidth; fitAllEntryHeights(); }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAllEntryHeights);

  function addEntry() {
    entryCount++;
    const container = document.getElementById('entriesContainer');
    
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.dataset.id = entryCount;
    row.draggable = true;
    
    row.innerHTML = `
      <div class="drag-handle">≡</div>
      <div class="entry-wrapper">
        <textarea class="entry-input" rows="2" placeholder="入力してください…"></textarea>
        ${entryCount > 3 ? '<button class="btn-remove" onclick="removeEntry(this)">×</button>' : ''}
      </div>
    `;
    
    container.appendChild(row);
    
    const textarea = row.querySelector('.entry-input');
    
    // 自動リサイズ + 未保存フラグを立てる（読み込みに上書きされないようにする）
    textarea.addEventListener('input', function() {
      fitEntryHeight(this);
      markDirty();
    });
    
    // Tabキー対応
    textarea.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const inputs = [...document.querySelectorAll('.entry-input')];
        const currentIndex = inputs.indexOf(this);
        const next = inputs[currentIndex + 1];
        if (next) {
          next.focus();
        } else {
          document.getElementById('btnAdd').focus();
        }
      }
    });
    
    // ドラッグ&ドロップイベント
    row.addEventListener('dragstart', handleDragStart);
    row.addEventListener('dragend', handleDragEnd);
    row.addEventListener('dragover', handleDragOver);
    row.addEventListener('drop', handleDrop);
    row.addEventListener('dragenter', handleDragEnter);
    row.addEventListener('dragleave', handleDragLeave);

    // 指（タッチ・ペン）での並び替え：ハンドル「≡」を押したまま動かす
    // （上のドラッグ&ドロップはマウス用で、スマホでは発生しないため）
    row.querySelector('.drag-handle').addEventListener('pointerdown', handleTouchDragStart);
  }

  function removeEntry(btn) {
    const row = btn.closest('.entry-row');
    row.style.animation = 'fadeSlideIn 0.3s ease reverse';
    setTimeout(() => row.remove(), 300);
  }

  // 戻り値：記録を受け付けた（端末に退避して送信を始めた）ら true、保存しなかったら false
  async function submitDiary() {
    // 最後の砦：画面の内容が属する日付と、表示中の日付が違うときは、絶対に保存しない（別の日へのコピーを防ぐ）
    if (formDate !== currentDateStr()) {
      setStatus('画面の内容と日付が合っていないため保存しませんでした。日付を選び直してください', 'error');
      return false;
    }

    const inputs = document.querySelectorAll('.entry-input');
    const entries = [...inputs].map(el => el.value.trim()).filter(v => v !== '');
    const health = getHealth();

    // 日記・体調・写真のどれか1つでも入っていれば保存できる
    if (entries.length === 0 && health === '' && photos.length === 0) {
      setStatus('日記・体調・写真のどれかを、少なくとも1つ入力してください', 'error');
      return false;
    }

    if (GAS_URL === 'YOUR_GAS_WEB_APP_URL') {
      setStatus('⚠ GASのURLを設定してください', 'error');
      return false;
    }

    document.getElementById('submitBtn').disabled = true;

    // 新しく選んだ写真は、先にGASへ届いていることを確認してから日記を保存する
    // （届いていないまま日記に写真を紐づけない）。届かないときは保存せず、入力はそのまま残す。
    const unsent = photos.filter(p => p.local && p.status !== 'done');
    if (unsent.length > 0) {
      setStatus('写真を送信しています…', 'sending');
      const results = await Promise.all(unsent.map(ensurePhotoUploaded));
      if (results.some(ok => !ok)) {
        setStatus('写真を送信できていません。通信を確認して、もう一度「記録する」を押してください（写真を外せば、日記だけ保存できます）', 'error');
        document.getElementById('submitBtn').disabled = false;
        return false;
      }
      setStatus('', '');
      // 写真の送信を待っている間に日付が動いていたら、保存しない
      if (formDate !== currentDateStr()) {
        setStatus('画面の内容と日付が合っていないため保存しませんでした。日付を選び直してください', 'error');
        document.getElementById('submitBtn').disabled = false;
        return false;
      }
    }

    const dateStr = currentDateStr();
    // 写真の状態をサーバーから確認できていないとき（photosKnown=false）は photos を送らず、今の写真を変えない
    const record = { date: dateStr, entries: entries, health: health, photos: photosKnown ? getPhotoTokens() : undefined, updateRow: currentUpdateRow };

    console.log('送信データ:', JSON.stringify(record));
    console.log('送信先URL:', GAS_URL);

    // 送信を試す前に、まずローカルへ退避しておく
    // （このあと送信中にタブを閉じたり通信が失敗したりしても、記録そのものは消えない）
    upsertPendingSave(record);

    // 送信を待たせず、まず完了表示にする（今の内容はこれから送信するので「未保存」ではなくなる）
    isDirty = false;
    showSentOverlay();

    // 実際の送信と、本当に届いたかの確認・必要なら再送は、すべて裏で行う
    syncPendingRecord(record);
    return true;
  }

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = `status ${type}`;
  }

  function clearForm() {
    document.getElementById('entriesContainer').innerHTML = '';
    entryCount = 0;
    currentUpdateRow = null;
    for (let i = 0; i < 3; i++) {
      addEntry();
    }
    setHealth('');
    setPhotos([]);
    formDate = currentDateStr();
    setStatus('', '');
    document.getElementById('submitBtn').disabled = false;
  }

  function showSentOverlay() {
    const message = currentUpdateRow ? '更新完了' : '記録完了';
    document.querySelector('.sent-message').textContent = message;
    document.getElementById('sentOverlay').classList.add('show');
    setTimeout(closeSentOverlay, 2000);
  }

  function closeSentOverlay() {
    document.getElementById('sentOverlay').classList.remove('show');
    document.getElementById('submitBtn').disabled = false;
  }

  // ドラッグ&ドロップ機能
  let draggedElement = null;

  function handleDragStart(e) {
    draggedElement = this;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragEnd(e) {
    this.classList.remove('dragging');
    document.querySelectorAll('.entry-row').forEach(row => {
      row.classList.remove('drag-over');
    });
    markDirty(); // 並び順の変更も「未保存の変更」として扱う
  }

  function handleDragOver(e) {
    if (e.preventDefault) {
      e.preventDefault();
    }
    e.dataTransfer.dropEffect = 'move';
    return false;
  }

  function handleDragEnter(e) {
    if (this !== draggedElement) {
      this.classList.add('drag-over');
    }
  }

  function handleDragLeave(e) {
    this.classList.remove('drag-over');
  }

  function handleDrop(e) {
    if (e.stopPropagation) {
      e.stopPropagation();
    }

    if (draggedElement !== this) {
      const container = document.getElementById('entriesContainer');
      const allRows = [...container.querySelectorAll('.entry-row')];
      const draggedIndex = allRows.indexOf(draggedElement);
      const targetIndex = allRows.indexOf(this);

      if (draggedIndex < targetIndex) {
        this.parentNode.insertBefore(draggedElement, this.nextSibling);
      } else {
        this.parentNode.insertBefore(draggedElement, this);
      }
    }

    return false;
  }

  // ── 指（タッチ・ペン）での並び替え ──
  // ハンドルを押す → 指を上下に動かす（他の行の中央を越えたら入れ替わる）→ 離すと確定。
  // 画面の端に近づくと、自動でスクロールする。
  let touchDrag = null;

  function handleTouchDragStart(e) {
    if (e.pointerType === 'mouse') return; // マウスは従来のドラッグ&ドロップ
    if (touchDrag) return;
    e.preventDefault();

    const row = this.closest('.entry-row');
    const container = document.getElementById('entriesContainer');
    touchDrag = {
      row: row,
      pointerId: e.pointerId,
      startIndex: [...container.querySelectorAll('.entry-row')].indexOf(row),
      wasDraggable: row.draggable,
    };
    row.draggable = false; // 長押しでブラウザ標準のドラッグが始まって、邪魔されないように
    row.classList.add('touch-dragging');

    // 行を動かす（DOM上で付け替える）たびに、入場アニメーションが最初からやり直されて
    // 行が一瞬消えるのを防ぐ。アニメーションを止めるとき、表示状態（opacity）は明示的に保つ。
    document.querySelectorAll('.entry-row').forEach(r => {
      r.style.animation = 'none';
      r.style.opacity = '1';
    });

    document.addEventListener('pointermove', handleTouchDragMove, { passive: false });
    document.addEventListener('pointerup', handleTouchDragEnd);
    document.addEventListener('pointercancel', handleTouchDragEnd);
  }

  function handleTouchDragMove(e) {
    if (!touchDrag || e.pointerId !== touchDrag.pointerId) return;
    e.preventDefault();

    const container = document.getElementById('entriesContainer');
    const current = touchDrag.row;
    const others = [...container.querySelectorAll('.entry-row')].filter(r => r !== current);

    // 指の位置より下に中央がある、最初の行の手前に入れる（無ければ一番後ろ）
    let before = null;
    for (const r of others) {
      const rect = r.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) { before = r; break; }
    }
    if (before) {
      if (current.nextElementSibling !== before) container.insertBefore(current, before);
    } else if (container.lastElementChild !== current) {
      container.appendChild(current);
    }

    // 画面の上下の端に近いときは、その方向へスクロール
    const edge = 70;
    if (e.clientY < edge) window.scrollBy(0, -14);
    else if (e.clientY > window.innerHeight - edge) window.scrollBy(0, 14);
  }

  function handleTouchDragEnd(e) {
    if (!touchDrag || e.pointerId !== touchDrag.pointerId) return;

    document.removeEventListener('pointermove', handleTouchDragMove);
    document.removeEventListener('pointerup', handleTouchDragEnd);
    document.removeEventListener('pointercancel', handleTouchDragEnd);

    const row = touchDrag.row;
    const container = document.getElementById('entriesContainer');
    const endIndex = [...container.querySelectorAll('.entry-row')].indexOf(row);
    row.classList.remove('touch-dragging');
    row.draggable = touchDrag.wasDraggable;
    const moved = endIndex !== touchDrag.startIndex;
    touchDrag = null;

    if (moved) markDirty(); // 並び順の変更も「未保存の変更」として扱う
  }

  // カレンダー機能
  let calendarViewDate = new Date();
  let entryDatesSet = new Set();

  function formatDateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  async function openCalendar() {
    calendarViewDate = new Date(selectedDate);
    document.getElementById('calendarOverlay').classList.add('show');
    renderCalendar(); // 先に現在の内容で描画し、体感待ちを減らす
    await fetchEntryDates();
    renderCalendar();
  }

  function closeCalendar() {
    document.getElementById('calendarOverlay').classList.remove('show');
  }

  async function fetchEntryDates() {
    try {
      const response = await fetch(gasGetUrl({ action: 'dates' }));
      const data = await response.json();
      entryDatesSet = new Set(data.status === 'unauthorized' ? [] : (data.dates || []));
    } catch (err) {
      console.log('カレンダー用データ取得失敗:', err.message);
      entryDatesSet = new Set();
    }
  }

  function calendarChangeMonth(delta) {
    calendarViewDate.setMonth(calendarViewDate.getMonth() + delta);
    renderCalendar();
  }

  function renderCalendar() {
    const year = calendarViewDate.getFullYear();
    const month = calendarViewDate.getMonth(); // 0始まり

    document.getElementById('calendarMonthLabel').textContent = `${year}年${month + 1}月`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const firstWeekday = new Date(year, month, 1).getDay(); // 0=日
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const todayStr = formatDateStr(new Date());
    const selectedStr = document.getElementById('dateInput').value;

    for (let i = 0; i < firstWeekday; i++) {
      const empty = document.createElement('div');
      empty.className = 'calendar-day empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'calendar-day';
      cell.textContent = d;
      if (entryDatesSet.has(dateStr)) cell.classList.add('has-entry');
      if (dateStr === todayStr) cell.classList.add('is-today');
      if (dateStr === selectedStr) cell.classList.add('is-selected');
      cell.onclick = () => selectCalendarDate(dateStr);
      grid.appendChild(cell);
    }
  }

  function selectCalendarDate(dateStr) {
    closeCalendar();
    goToDate(dateStr);
  }
